name: pre-commit
description: run pre-commit checks
inputs:
  config-path:
    description: Optional, specify an alternative path to a .pre-commit-config.yaml file
    required: false
    default: '.pre-commit-config.yaml'
  extra-args:
    description: extra arguments passed to pre-commit run command
    required: false
    default: ''
  ignore-failure:
    description: Optional, do not fail the gh-action in case of pre-commit check failure
    required: false
    default: 'false'
outputs:
  status:
    description: Provide the exit code returned by pre-commit run command
    value: ${{ steps.exec-pre-commit.outputs.status }}
  logs:
    description: Logs from the pre-commit run command
    value: ${{ steps.exec-pre-commit.outputs.logs }}

runs:
  using: composite
  steps:
    - name: Validate inputs and export
      shell: bash
      run: |
        CONFIG_PATH="${{ inputs.config-path }}"
        EXTRA_ARGS="${{ inputs.extra-args }}"
        echo "CONFIG_PATH=$CONFIG_PATH" >> "$GITHUB_ENV"
        echo "EXTRA_ARGS=$EXTRA_ARGS"   >> "$GITHUB_ENV"
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Fetch origin
      run: git fetch origin # avoid unknown revision or path not in the working tree when
      # using --from-ref --to-ref feature of pre-commit
      shell: bash
    - name: Fetch Repox credentials
      uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
      id: repox-secrets
      with:
        secrets: |
          development/artifactory/token/{REPO_OWNER_NAME_DASH}-${{ github.event.repository.visibility == 'public' && 'public-reader' || 'private-reader' }} username | ARTIFACTORY_USERNAME;
          development/artifactory/token/{REPO_OWNER_NAME_DASH}-${{ github.event.repository.visibility == 'public' && 'public-reader' || 'private-reader' }} access_token | ARTIFACTORY_ACCESS_TOKEN;
    - name: Configure Repox for pip and npm
      shell: bash
      env:
        ARTIFACTORY_USERNAME: ${{ fromJSON(steps.repox-secrets.outputs.vault).ARTIFACTORY_USERNAME }}
        ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.repox-secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
      run: bash "${{ github.action_path }}/scripts/configure-repox.sh"
    - id: setup_python
      name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.14'
    - name: Setup pre-commit
      run: |
        python -m pip install --upgrade pip
        python -m pip install --quiet pre-commit==3.7.1
      shell: bash
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: restore-cache
      with:
        key: pre-commit|${{ env.pythonLocation }}|${{ hashFiles(env.CONFIG_PATH) }}
        path: ~/.cache/pre-commit
    - name: Check existence of .pre-commit-config.yaml file
      run: |
        if [ ! -f "$CONFIG_PATH" ]; then
          echo "Could not find any pre-commit configuration at the provided location: '$CONFIG_PATH'"
          exit 1
        fi
      shell: bash
    # Step-scoped insteadOf (not `git config --global`) so only these two steps
    # rewrite github.com URLs, letting hook clones in ~/.cache/pre-commit use
    # GITHUB_TOKEN while the rest of the job (incl. `git fetch origin` above)
    # keeps using checkout's persist-credentials extraheader untouched.
    # NOTE: within these steps the workspace remote is rewritten too, so a hook
    # that performs a network git op on `origin` will send both the extraheader
    # and URL basic credentials.
    - id: setup-pre-commit-hooks
      if: steps.restore-cache.outputs.cache-hit != 'true'
      name: Install pre-commit dependencies
      env:
        GIT_ASKPASS: /bin/true   # allowlisted by pre-commit's no_git_env
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadof"
        GIT_CONFIG_VALUE_0: "https://github.com/"
      run: |
        pre-commit install-hooks --config="$CONFIG_PATH"
      shell: bash
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.restore-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        key: pre-commit|${{ env.pythonLocation }}|${{ hashFiles(env.CONFIG_PATH) }}
        path: ~/.cache/pre-commit
    - id: exec-pre-commit
      name: Execute pre-commit
      env:
        GIT_ASKPASS: /bin/true   # allowlisted by pre-commit's no_git_env
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadof"
        GIT_CONFIG_VALUE_0: "https://github.com/"
      run: |
        set +e
        OUTPUT=$(pre-commit run --config="$CONFIG_PATH" --show-diff-on-failure --color=always $EXTRA_ARGS)
        STATUS=$?
        echo "status=$(echo $STATUS)" >> "$GITHUB_OUTPUT"
        # Securely expose log a random delimiter
        DELIM="DELIM_$(openssl rand -hex 16)"
        while echo "$OUTPUT" | grep -q "$DELIM"; do
          DELIM="DELIM_$(openssl rand -hex 16)"
        done
        echo "logs<<$DELIM" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "$DELIM" >> "$GITHUB_OUTPUT"
        exit 0
      shell: bash
    - name: Print execution
      run: |
        echo "${{ steps.exec-pre-commit.outputs.logs }}"
        echo "Exit code: ${{ steps.exec-pre-commit.outputs.status }}"
      shell: bash
    - name: Check status and fail if necessary
      if: ${{ inputs.ignore-failure == 'false' && steps.exec-pre-commit.outputs.status != 0 }}
      run: |
        echo "::error ::pre-commit execution detected some issues"
        exit 1
      shell: bash
